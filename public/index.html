<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>陸上計時 ビデオ判定版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: white; margin: 0; text-align: center; overflow: hidden; }
        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        .active { display: flex; }
        
        /* タイマー表示 */
        #timer, #timer-start { font-size: 75px; font-family: 'Courier New', monospace; margin: 5px; font-weight: bold; color: #fff; }
        
        /* ビデオエリア */
        .viewport { position: relative; width: 100%; max-width: 500px; aspect-ratio: 16/9; background: #000; border: 2px solid #444; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .guide-line { position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: #ffea00; z-index: 10; box-shadow: 0 0 5px rgba(255, 234, 0, 0.7); }
        
        /* ボタン基本デザイン */
        button { border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .btn-blue { background: #007bff; color: white; padding: 18px; width: 100%; max-width: 320px; font-size: 20px; }
        .btn-red { background: #dc3545; color: white; padding: 20px; width: 100%; max-width: 320px; font-size: 22px; margin-top: 15px; }
        .btn-green { background: #28a745; color: white; padding: 15px; width: 100%; max-width: 320px; font-size: 18px; margin-top: 10px; }
        .btn-gray { background: #333; color: white; padding: 12px; font-size: 14px; margin-top: 10px; }

        /* フレーム微調整ボタン */
        .step-controls { display: flex; gap: 8px; margin: 15px 0; width: 100%; max-width: 350px; justify-content: center; }
        .btn-step { flex: 1; height: 60px; background: #444; color: white; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
        .btn-step span { font-size: 10px; color: #aaa; }

        #records-list { text-align: left; background: #222; padding: 12px; border-radius: 8px; width: 100%; max-width: 320px; margin-top: 10px; font-size: 14px; }
        #qrcode { background: white; padding: 10px; margin: 15px; border-radius: 5px; }
        #adjust-time { font-size: 55px; color: #00ff00; font-family: monospace; margin: 5px; }
    </style>
</head>
<body>

    <!-- セットアップ -->
    <div id="setup-screen" class="screen active">
        <h1>陸上計時ツール</h1>
        <button class="btn-blue" onclick="setupStart()">スタート端末 (A) 起動</button>
    </div>

    <!-- スタート画面 (Chromebook) -->
    <div id="start-screen" class="screen">
        <h2>ルーム: <span id="disp-room-id"></span></h2>
        <div id="qrcode"></div>
        <p id="start-status">スマホ接続待機中...</p>
        <div id="timer-start">00.000</div>
        <button id="start-seq-btn" class="btn-blue">スタートシーケンス開始</button>
        <button class="btn-gray" onclick="dissolveRoom()">ルーム解散</button>
    </div>

    <!-- ゴール画面 (スマホ) -->
    <div id="goal-screen" class="screen">
        <div id="timer">00.000</div>
        <div class="viewport"><video id="preview" autoplay playsinline muted></video><div class="guide-line"></div></div>
        <button id="manual-stop-btn" class="btn-red">GOAL / STOP</button>
        <div id="records-list"><b>【保存済み記録】</b><div id="records-content"></div></div>
    </div>

    <!-- フレーム調整画面 -->
    <div id="adjust-screen" class="screen">
        <h3 style="margin:5px;">ゴール判定</h3>
        <div class="viewport"><video id="playback" playsinline></video><div class="guide-line"></div></div>
        
        <div id="adjust-time">00.000</div>

        <!-- 0.1秒 / 0.01秒 刻みのボタン -->
        <div class="step-controls">
            <button class="btn-step" onclick="step(-0.1)">≪<br><span>-0.1s</span></button>
            <button class="btn-step" onclick="step(-0.01)">＜<br><span>-0.01s</span></button>
            <button class="btn-step" onclick="step(0.01)">＞<br><span>+0.01s</span></button>
            <button class="btn-step" onclick="step(0.1)">≫<br><span>+0.1s</span></button>
        </div>

        <button class="btn-green" onclick="saveRecord()">名前を入力して保存</button>
        <button class="btn-gray" style="width:100%; max-width:320px;" onclick="sendReset()">保存せずに次へ</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room'), role = urlParams.get('role');
        let offset = 0, raceStartTime = 0, videoStartTime = 0, tapTime = 0, timerInterval = null;
        let mediaRecorder, recordedChunks = [];

        // 音声設定
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let gunBuffer = null;
        fetch('gun.mp3').then(r => r.arrayBuffer()).then(b => audioCtx.decodeAudioData(b)).then(buf => gunBuffer = buf);
        const AUDIO_LATENCY_OFFSET = 120; // ミリ秒（音のラグに合わせて調整）

        if (roomId && role === 'goal') setupGoal(roomId);

        function setupStart() {
            role = 'start'; roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            showScreen('start-screen'); document.getElementById('disp-room-id').innerText = roomId;
            new QRCode(document.getElementById("qrcode"), { text: `${window.location.origin}/index.html?role=goal&room=${roomId}`, width: 160, height: 160 });
            socket.emit('join_room', roomId); startSync();
        }

        async function setupGoal(rId) {
            role = 'goal'; roomId = rId; showScreen('goal-screen');
            socket.emit('join_room', roomId); startSync(); initCamera(); updateRecordsDisplay();
        }

        function startSync() {
            setInterval(() => socket.emit("sync", { c: Date.now(), roomId }), 2000);
            socket.on("sync_res", d => offset = d.s - (d.c + (Date.now() - d.c)/2));
        }

        socket.on("member_joined", d => {
            if (role === 'start' && d.count > 1) document.getElementById('start-status').innerText = "スマホ接続完了！READY";
        });

        document.getElementById('start-seq-btn').onclick = async () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            speak("On your marks"); await new Promise(r => setTimeout(r, 5000));
            speak("Set"); await new Promise(r => setTimeout(r, 2000));
            const bangTime = Date.now() + offset + 100;
            socket.emit("start_signal", { roomId, startTime: bangTime });
        };

        function speak(m) {
            const u = new SpeechSynthesisUtterance(m); u.lang = 'en-US'; window.speechSynthesis.speak(u);
        }

        socket.on("start_broadcast", d => {
            raceStartTime = d.startTime; recordedChunks = [];
            let soundTriggered = false;
            if (role === 'goal') { mediaRecorder.start(); videoStartTime = Date.now() + offset; }
            const wait = setInterval(() => {
                const now = Date.now() + offset;
                if (role === 'start' && !soundTriggered && now >= raceStartTime - AUDIO_LATENCY_OFFSET) {
                    if (gunBuffer) {
                        const s = audioCtx.createBufferSource(); s.buffer = gunBuffer; s.connect(audioCtx.destination); s.start(0);
                    }
                    soundTriggered = true;
                }
                if (now >= raceStartTime) {
                    clearInterval(wait); runTimer(raceStartTime, (role === 'goal' ? 'timer' : 'timer-start'));
                }
            }, 2);
        });

        document.getElementById('manual-stop-btn').onclick = () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                tapTime = Date.now() + offset;
                const finalTime = ((tapTime - raceStartTime) / 1000).toFixed(3);
                socket.emit("stop_signal", { roomId, finalTime });
                setTimeout(() => mediaRecorder.stop(), 1200); // 1.2秒余分に録画
            }
        };

        socket.on("stop_broadcast", d => {
            clearInterval(timerInterval);
            const target = (role === 'goal' ? 'timer' : 'timer-start');
            document.getElementById(target).innerText = d.finalTime;
        });

        socket.on("reset_broadcast", () => {
            clearInterval(timerInterval);
            document.getElementById('timer').innerText = "00.000";
            document.getElementById('timer-start').innerText = "00.000";
            if(role === 'goal') showScreen('goal-screen');
        });

        function sendReset() { socket.emit("reset_signal", roomId); }

        function saveRecord() {
            const name = prompt("選手名を入力してください:");
            if (!name) return;
            const time = document.getElementById('adjust-time').innerText;
            const records = JSON.parse(localStorage.getItem('running_records') || '[]');
            records.unshift({ name, time, date: new Date().toLocaleString() });
            localStorage.setItem('running_records', JSON.stringify(records));
            updateRecordsDisplay(); sendReset();
        }

        function updateRecordsDisplay() {
            const records = JSON.parse(localStorage.getItem('running_records') || '[]');
            document.getElementById('records-content').innerHTML = records.slice(0, 5).map(r => `<div>${r.name}: ${r.time}s</div>`).join('');
        }

        async function initCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            document.getElementById('preview').srcObject = stream;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                showScreen('adjust-screen');
                const pb = document.getElementById('playback');
                pb.src = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/webm' }));
                pb.onloadeddata = () => { pb.currentTime = (tapTime - videoStartTime) / 1000; updateAdjustTime(); };
                pb.ontimeupdate = updateAdjustTime;
            };
        }

        function updateAdjustTime() {
            const pb = document.getElementById('playback');
            const t = (videoStartTime + (pb.currentTime * 1000) - raceStartTime) / 1000;
            if (t > 0) document.getElementById('adjust-time').innerText = t.toFixed(3);
        }

        // --- フレーム微調整のコア関数 ---
        function step(val) {
            const pb = document.getElementById('playback');
            pb.pause();
            pb.currentTime += val; // ここで 0.01s や 0.1s 刻みで動かす
        }

        function runTimer(base, id) {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = (Date.now() + offset - base) / 1000;
                if(diff > 0) document.getElementById(id).innerText = diff.toFixed(3);
            }, 35);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function dissolveRoom() { if(confirm("ルームを解散しますか？")) socket.emit("dissolve_room", roomId); }
        socket.on("room_dissolved", () => { window.location.href = 'index.html'; });
    </script>
</body>
</html>
